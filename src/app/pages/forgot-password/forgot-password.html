<ion-content [fullscreen]="true" [scrollY]="false" class="auth-content" dir="rtl">
    <main class="auth-page">
        <header><button type="button" (click)="goBack()"><ion-icon name="arrow-forward-outline"></ion-icon></button>
            <h1>نسيت كلمة المرور</h1>
        </header>
        <section class="auth-card">
            <div class="auth-icon"><ion-icon name="mail-outline"></ion-icon></div>
            <h2>استعادة كلمة المرور</h2>
            <p>أدخل بريدك الإلكتروني الوظيفي وسنرسل لك تعليمات إعادة التعيين.</p><label>البريد الإلكتروني
                الوظيفي</label><ion-input [(ngModel)]="email" type="email" inputmode="email" dir="ltr"
                placeholder="example@jeddah.gov.sa"></ion-input><ion-button expand="block" (click)="submit()">إرسال
                التعليمات</ion-button>
            <div class="success" *ngIf="sent">تم إرسال التعليمات إلى بريدك الوظيفي.</div>
        </section>
    </main>
</ion-content>
