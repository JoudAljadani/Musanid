<ion-content [fullscreen]="true" [scrollY]="false" class="auth-content" dir="rtl">
    <main class="auth-page">
        <header><button type="button" (click)="goBack()"><ion-icon name="arrow-forward-outline"></ion-icon></button>
            <h1>تغيير كلمة المرور</h1>
        </header>
        <section class="auth-card">
            <div class="auth-icon"><ion-icon name="lock-closed-outline"></ion-icon></div>
            <h2>تحديث كلمة المرور</h2>
            <p>اكتب كلمة المرور الحالية ثم اختر كلمة مرور جديدة.</p><label>كلمة المرور الحالية</label><ion-input
                [(ngModel)]="current" type="password"></ion-input><label>كلمة المرور الجديدة</label><ion-input
                [(ngModel)]="next" type="password"></ion-input><label>تأكيد كلمة المرور</label><ion-input
                [(ngModel)]="confirm" type="password"></ion-input><ion-button expand="block" (click)="save()">حفظ
                التغييرات</ion-button>
            <div class="success" *ngIf="saved">تم تحديث كلمة المرور بنجاح.</div>
        </section>
    </main>
</ion-content>
