<ion-content [fullscreen]="true" [scrollY]="false" class="settings-content" dir="rtl"><main class="settings-page"><header><button (click)="goBack()"><ion-icon name="arrow-back-outline"></ion-icon></button><h1>سياسة الخصوصية</h1></header><section class="privacy-hero"><ion-icon name="shield-checkmark-outline"></ion-icon><div><h2>خصوصيتك تهمنا</h2><p>نلتزم بحماية بياناتك الشخصية واستخدامها بمسؤولية وشفافية.</p></div></section><section class="privacy-list"><button *ngFor="let item of items"><span class="item-icon"><ion-icon [name]="item[2]"></ion-icon></span><span><strong>{{item[0]}}</strong><small>{{item[1]}}</small></span><ion-icon class="arrow" name="chevron-back-outline"></ion-icon></button></section></main></ion-content>
