<ion-content [fullscreen]="true" [scrollY]="false" class="logout-content" dir="rtl">
    <main class="logout-page">
        <section class="confirm-card">
            <div class="logout-icon"><ion-icon name="log-out-outline"></ion-icon></div>
            <h1>هل أنت متأكد من تسجيل الخروج؟</h1>
            <p>سيتم تسجيل خروجك من النظام، وسيتطلب منك تسجيل الدخول مرة أخرى.</p>
        </section><button type="button" class="confirm-button" (click)="confirm()"><ion-icon
                name="log-out-outline"></ion-icon><span>تسجيل الخروج</span></button><button type="button"
            class="cancel-button" (click)="cancel()">إلغاء</button>
    </main>
</ion-content>
